name: Deploy to Heroku

on:
  push:
    branches: [ deployment ]

jobs:
  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code with full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Create environment file for build
      run: |
        echo "DATABASE_URL=postgresql://test:test@localhost/test" >> .env.local
        echo "CLOUDINARY_CLOUD_NAME=test" >> .env.local
        echo "CLOUDINARY_API_KEY=test" >> .env.local
        echo "CLOUDINARY_API_SECRET=test" >> .env.local
        echo "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=test" >> .env.local
    
    - name: Build application
      run: npm run build
    
    - name: Deploy to Heroku
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      run: |
        # Configure Git
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Add Heroku remote
        git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/dummy-ap.git
        
        # Push to Heroku (force push if needed)
        git push --force heroku HEAD:main