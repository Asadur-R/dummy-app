name: Deploy to Heroku

on:
  push:
    branches: [ deployment ]

jobs:
  test-build:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Create environment file for build
      run: |
        echo "DATABASE_URL=postgresql://test:test@localhost/test" >> .env.local
        echo "CLOUDINARY_CLOUD_NAME=test" >> .env.local
        echo "CLOUDINARY_API_KEY=test" >> .env.local
        echo "CLOUDINARY_API_SECRET=test" >> .env.local
        echo "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=test" >> .env.local
    
    - name: Run linting
      run: npm run lint --if-present
    
    - name: Build application
      run: npm run build
    
    - name: Run tests (if any)
      run: npm test --if-present

  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: test-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Heroku
      uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: "dummy-ap"
        heroku_email: "asad.rehman@aurorasolutions.io"
        health_check: "https://dummy-ap-7086c38c79ab.herokuapp.com/"
        rollback_on_health_check_failure: true